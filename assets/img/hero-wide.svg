<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Space Grotesk, Pretendard, Arial, sans-serif">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#0d0d12" opacity=".12"/></pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0d0d12"/></marker>
  </defs>

  <!-- window -->
  <rect x="2" y="2" width="996" height="326" rx="18" fill="#fff" stroke="#0d0d12" stroke-width="2.5"/>
  <rect x="2" y="54" width="996" height="274" fill="url(#dots)"/>
  <path d="M2 54h996" stroke="#0d0d12" stroke-width="2.5"/>
  <circle cx="28" cy="28" r="6" fill="#0d0d12"/><circle cx="48" cy="28" r="6" fill="none" stroke="#0d0d12" stroke-width="2"/><circle cx="68" cy="28" r="6" fill="#c6f03c" stroke="#0d0d12" stroke-width="2"/>
  <text x="972" y="33" text-anchor="end" font-size="13" font-weight="600" fill="#6c6c78">ai_pipeline.py</text>

  <!-- 01 DATA -->
  <g transform="translate(28 78)">
    <rect width="236" height="140" rx="14" fill="#fff" stroke="#0d0d12" stroke-width="2.5"/>
    <text x="18" y="30" font-size="12" font-weight="700" fill="#6b3df5">01 DATA</text>
    <g transform="translate(22 56)" stroke="#0d0d12" stroke-width="2.2" fill="#fff">
      <ellipse cx="22" cy="8" rx="20" ry="7"/>
      <path d="M2 8v38c0 4 9 7 20 7s20-3 20-7V8"/>
      <path d="M2 21c0 4 9 7 20 7s20-3 20-7M2 34c0 4 9 7 20 7s20-3 20-7" fill="none"/>
    </g>
    <g font-size="13" font-weight="600" fill="#2b2b35">
      <text x="96" y="70">Tabular</text><text x="96" y="90">Time-series</text><text x="96" y="110">Image · Audio</text>
    </g>
  </g>

  <!-- arrow 1 -> 2 -->
  <path d="M266 148h34" stroke="#0d0d12" stroke-width="2.5" marker-end="url(#ah)"/>

  <!-- 02 MODEL -->
  <g transform="translate(306 78)">
    <rect width="236" height="140" rx="14" fill="#0d0d12" stroke="#0d0d12" stroke-width="2.5"/>
    <text x="18" y="30" font-size="12" font-weight="700" fill="#c6f03c">02 MODEL</text>
    <g transform="translate(22 56)" stroke="#c6f03c" stroke-width="1.6">
      <path d="M8 6 40 2M8 6 40 24M8 6 40 46M8 26 40 2M8 26 40 24M8 26 40 46M8 46 40 2M8 46 40 24M8 46 40 46M40 2 70 24M40 24 70 24M40 46 70 24" opacity=".7"/>
      <g fill="#0d0d12" stroke-width="2.2"><circle cx="8" cy="6" r="5"/><circle cx="8" cy="26" r="5"/><circle cx="8" cy="46" r="5"/><circle cx="40" cy="2" r="5"/><circle cx="40" cy="24" r="5"/><circle cx="40" cy="46" r="5"/><circle cx="70" cy="24" r="6" fill="#c6f03c"/></g>
    </g>
    <g font-size="13" font-weight="600" fill="#fff">
      <text x="126" y="70">LLM</text><text x="126" y="90">Multimodal</text><text x="126" y="110">ML</text>
    </g>
  </g>

  <!-- arrow 2 -> 3 -->
  <path d="M544 148h38" fill="none" stroke="#0d0d12" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ah)"/>

  <!-- 03 SERVICE -->
  <g transform="translate(588 78)">
    <rect width="384" height="140" rx="14" fill="#fff" stroke="#0d0d12" stroke-width="2.5"/>
    <text x="16" y="30" font-size="12" font-weight="700" fill="#6b3df5">03 SERVICE</text>
    <!-- agent graph -->
    <g transform="translate(16 48)" font-size="11" font-weight="700">
      <rect width="72" height="30" rx="8" fill="#f0ebff" stroke="#0d0d12" stroke-width="2"/><text x="36" y="19" text-anchor="middle" fill="#0d0d12">Agent</text>
      <rect x="92" width="72" height="30" rx="8" fill="#fff" stroke="#0d0d12" stroke-width="2"/><text x="128" y="19" text-anchor="middle" fill="#0d0d12">RAG</text>
      <rect x="184" width="72" height="30" rx="8" fill="#fff" stroke="#0d0d12" stroke-width="2"/><text x="220" y="19" text-anchor="middle" fill="#0d0d12">Verify</text>
      <rect x="276" width="76" height="30" rx="8" fill="#c6f03c" stroke="#0d0d12" stroke-width="2"/><text x="314" y="19" text-anchor="middle" fill="#0d0d12">Deploy</text>
      <path d="M72 15h20M164 15h20M256 15h20" stroke="#0d0d12" stroke-width="2"/>
    </g>
    <!-- logs -->
    <g transform="translate(16 96)" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#6c6c78">
      <text y="10"><tspan fill="#6b3df5">✓</tspan> schema validated</text>
      <text x="130" y="10"><tspan fill="#6b3df5">✓</tspan> grounded answer</text>
      <text x="262" y="10"><tspan fill="#6b3df5">✓</tspan> on-prem</text>
      <text y="30"><tspan fill="#6b3df5">✓</tspan> human approval</text>
      <text x="130" y="30"><tspan fill="#6b3df5">✓</tspan> audit log</text>
      <text x="262" y="30"><tspan fill="#6b3df5">✓</tspan> rollback</text>
    </g>
  </g>

  <!-- stack strip -->
  <g transform="translate(28 240)">
    <rect width="944" height="62" rx="14" fill="#0d0d12"/>
    <text x="20" y="37" font-size="11" font-weight="700" fill="#c6f03c" letter-spacing=".08em">STACK</text>
    <g font-size="13" font-weight="600" fill="#fff">
      <text x="88" y="37">PyTorch · LangGraph · FastAPI · Docker</text>
    </g>
    <g transform="translate(870 14)" fill="#6b3df5">
      <rect x="0" y="20" width="8" height="14" rx="2"/><rect x="12" y="12" width="8" height="22" rx="2"/><rect x="24" y="4" width="8" height="30" rx="2" fill="#c6f03c"/><rect x="36" y="14" width="8" height="20" rx="2"/>
    </g>
  </g>
</svg>
