<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>황류이 이력서 | Resume</title>
<meta name="description" content="황류이(Ryu I Hwang) 이력서. AI Engineer.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --ink:#0d0d12; --ink-2:#2b2b35; --muted:#6c6c78; --line:#e4e4ea;
  --violet:#6b3df5; --lime:#c6f03c; --bg:#f1f1ee;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --display:"Space Grotesk","Pretendard Variable",Pretendard,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
ul{list-style:none}

.toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;padding:14px 24px;background:rgba(241,241,238,.92);backdrop-filter:blur(8px)}
.toolbar a,.toolbar button{display:inline-flex;align-items:center;padding:9px 16px;border-radius:9px;font:700 14px var(--sans);border:1.5px solid var(--ink);cursor:pointer;background:#fff;color:var(--ink)}
.toolbar button{background:var(--ink);color:#fff}

.sheet{width:210mm;min-height:297mm;margin:8px auto 48px;background:#fff;padding:16mm 16mm 14mm;box-shadow:0 20px 50px -24px rgba(13,13,18,.35);font-size:9.4pt;line-height:1.6;color:var(--ink-2)}

/* header */
.head{display:flex;justify-content:space-between;align-items:center;gap:10mm;padding-bottom:6mm;border-bottom:2px solid var(--ink)}
.who{display:flex;align-items:center;gap:6mm}
.photo{flex:none;width:26mm;height:32mm;border-radius:3mm;overflow:hidden;border:1.5px solid var(--ink);background:#f6f6f3}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.head h1{font:700 24pt/1.1 var(--sans);color:var(--ink);letter-spacing:-.02em}
.head h1 span{font:600 12pt var(--display);color:var(--muted);margin-left:3mm;letter-spacing:.01em}
.head .role{margin-top:2.5mm;font:700 10.5pt var(--display);color:var(--violet);letter-spacing:.01em}
.head .contact{font-size:8.8pt;line-height:1.75;color:var(--ink-2)}
.head .contact b{display:inline-block;width:20mm;font:600 7.6pt var(--display);letter-spacing:.08em;color:var(--muted)}

.summary{margin-top:5mm;font-size:9.6pt;line-height:1.7;color:var(--ink-2)}

/* sections: fixed label column so every row lines up */
.sec{display:grid;grid-template-columns:30mm 1fr;gap:0 6mm;margin-top:6mm;padding-top:5mm;border-top:1px solid var(--line)}
.sec>h2{font:700 9pt var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);padding-top:.5mm}
.sec>h2::before{content:"";display:inline-block;width:2.4mm;height:2.4mm;border-radius:.6mm;background:var(--lime);border:1px solid var(--ink);margin-right:2mm;vertical-align:.1mm}
.items{display:grid;gap:4.2mm}
.exp{gap:0}
.exp>div{padding:4.6mm 0;border-top:1px dashed var(--line)}
.exp>div:first-child{padding-top:0;border-top:0}
.exp>div:last-child{padding-bottom:0}
.row-h{display:flex;justify-content:space-between;align-items:baseline;gap:6mm}
.row-h h3{font-size:10.2pt;font-weight:700;color:var(--ink);line-height:1.4}
.row-h time{flex:none;font:600 8.6pt var(--display);color:var(--muted);white-space:nowrap}
.sub{font-size:8.9pt;color:var(--muted);margin-top:.3mm}
.bul{margin-top:1.6mm;display:grid;gap:1mm}
.bul li{position:relative;padding-left:4mm}
.bul li::before{content:"";position:absolute;left:.4mm;top:2.3mm;width:1.3mm;height:1.3mm;border-radius:50%;background:var(--violet)}
.bul b{color:var(--ink);font-weight:700}

.skills{display:grid;gap:1.8mm}
.skills div{display:grid;grid-template-columns:36mm 1fr;gap:4mm}
.skills dt{font-weight:700;color:var(--ink)}

.list2{display:grid;grid-template-columns:1fr 1fr;gap:2.6mm 8mm}
.mini .row-h h3{font-size:9.3pt;font-weight:600}
.mini .sub{font-size:8.4pt}

@media screen and (max-width:820px){
  .sheet{width:auto;min-height:0;margin:8px 12px 40px;padding:24px 20px}
  .head{flex-direction:column;align-items:flex-start;gap:14px}
  .who{gap:16px}
  .sec{grid-template-columns:1fr;gap:10px}
  .list2{grid-template-columns:1fr}
  .skills div{grid-template-columns:1fr;gap:0}
  .row-h{flex-direction:column;gap:2px}
}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .toolbar{display:none}
  .sheet{margin:0;box-shadow:none;min-height:auto}
  .sec{break-inside:avoid}
}
</style>
</head>
<body>
<div class="toolbar"><a href="index.html">← 포트폴리오</a><button onclick="print()">PDF 저장 · 인쇄</button></div>
<article class="sheet" id="sheet"></article>

<script src="assets/js/data.js"></script>
<script>
(function () {
  const D = window.CAREER, P = D.profile;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Curated for a compact resume. No metrics here; numbers live in the portfolio's 성과 측정 sections.
  const JOBS = [
    { t: "이스트소프트 EST-LAB", r: "AI-ML 개발자 (인턴) · Agent 파이프라인 설계 및 개발", d: "2026.07 ~ 현재", b: [
      "<b>PMS 급여관리 시스템 DX · AX</b> 단독 개발: 엑셀 급여 로직을 FastAPI · PostgreSQL 계산 엔진으로 이관, LangGraph AI 서포터 · 하이브리드 RAG · 법정 요율 감시 · 이상치 탐지 구축",
      "<b>ESTory 사내 sLLM 회의록 자동화</b> 단독 개발: 벤치마크 기반 sLLM 선정, json_schema 근거 검증, STT · 화자 구분 파이프라인",
      "<b>EST-flow 근태 · 전자결재 시스템</b> 단독 개발: Next.js · Prisma 기반 멀티테넌트 구조, 결재와 근태의 트랜잭션 연동",
      "사내 규정 RAG 챗봇 소프트콘, 인사평가 플랫폼 ESTimate 기획 · 검토 지원" ] },
    { t: "이스트소프트 KDT [이스트캠프] 와썹 AI 모델 개발 13기", r: "교육생 · 수료", d: "2025.11 ~ 2026.04", b: [
      "Anomaly Transformer · IMDiffusion 기반 서버 시계열 이상 탐지 대시보드 <b>(2차 프로젝트 대상)</b>",
      "청년 고용 미시데이터 통계 검증 · 예측 · 반사실 추천 모델 <b>(1차 프로젝트 대상)</b>",
      "Emotion-LLaMA LoRA 파인튜닝, WebSocket 실시간 멀티모달 감정 인식 LLM Agent" ] },
    { t: "고려대학교 인공지능 연구실", r: "인턴 연구원", d: "2024.08 ~ 2025.02", b: [
      "SSL 표현을 조건으로 쓰는 Stable Diffusion (Rep-to-Image) 설계 · 구현",
      "CLIP · MedCLIP 기반 의료 영상 분류, Vision-Language 이상 탐지 연구 및 논문 리뷰" ] },
    { t: "(주)에임드바이오", r: "Scientist · AI정밀의학팀", d: "2023.07 ~ 2024.02", b: [
      "약물 스크리닝 정량화 (4PL DRC · AUC · IC50 · Z-score) 및 임상 · 유전체 데이터 통합 분석 파이프라인",
      "AACR 학회 포스터 공동저자, 대학병원 튜머보드 케이스 발표" ] },
    { t: "삼성서울병원 미래의학관", r: "과제참여연구원 · 신경외과 연구실", d: "2023.02 ~ 2023.06", b: [
      "난치성 암 코호트 임상 · 약물 · 유전체 데이터 정합, 환자유래세포 실험" ] },
    { t: "부산대학교 BIT융합기술연구소 바이러스의공학연구실", r: "참여 연구원", d: "2021.12 ~ 2023.01", b: [
      "종양살상 바이러스 · 파지 기반 치료제 국가 R&D 과제, 세포 · 분자 · 조직 · 동물 실험" ] },
  ];

  const edu = D.education;
  const row = (t, d, sub, bullets) => `<div><div class="row-h"><h3>${t}</h3><time>${esc(d)}</time></div>${sub ? `<div class="sub">${sub}</div>` : ""}${bullets && bullets.length ? `<ul class="bul">${bullets.map((x) => `<li>${x}</li>`).join("")}</ul>` : ""}</div>`;

  document.getElementById("sheet").innerHTML = `
    <header class="head">
      <div class="who"><div class="photo"><img src="assets/img/profile.jpg" alt="${esc(P.name)} 사진"></div><div><h1>${esc(P.name)}<span>${esc(P.name_en)}</span></h1><div class="role">${esc(P.role)}</div></div></div>
      <div class="contact">
        <div><b>EMAIL</b>${esc(P.email)}</div>
        <div><b>GITHUB</b>github.com/ryuihwang</div>
        <div><b>PORTFOLIO</b>ryuihwang.github.io</div>
      </div>
    </header>
    <p class="summary">${esc(P.about[0])} LLM 에이전트 · RAG 파이프라인 설계와 멀티모달 모델 연구, 정형 · 시계열 데이터 분석 경험을 바탕으로, 현재 이스트소프트 EST-LAB에서 사내 업무 시스템을 요구사항 정의부터 배포 · 운영까지 단독으로 설계 · 개발하고 있습니다.</p>

    <section class="sec"><h2>Experience</h2><div class="items exp">
      ${JOBS.map((j) => row(esc(j.t), j.d, esc(j.r), j.b)).join("")}
    </div></section>

    <section class="sec"><h2>Skills</h2><dl class="skills">
      ${Object.entries(D.skills).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v.map(esc).join(" · ")}</dd></div>`).join("")}
    </dl></section>

    <section class="sec"><h2>Education</h2><div class="items">
      ${row(esc(edu[0].school), `${edu[0].period_start} ~ ${edu[0].period_end}`, `${esc(edu[0].major.replace(" (주전공)", ""))} 학사 · 부전공 ${esc(edu[0].minor.replace(" (부전공)", ""))}`)}
    </div></section>

    <section class="sec"><h2>Research</h2><div class="items mini">
      ${D.publications_patents.map((x) => row(esc(x.title), String(x.date).slice(0, 7), `${esc(x.type)}${x.venue ? " · " + esc(x.venue) : ""}${x.number ? " · " + esc(x.number) : ""}`)).join("")}
    </div></section>

    <section class="sec"><h2>Awards</h2><div class="list2 mini">
      ${D.awards.map((a) => row(esc(a.title.replace(" ([이스트캠프] 와썹 AI 모델 개발 13회차)", " (이스트캠프 13기)").replace("[이스트캠프] 와썹 AI 모델 개발 13회차", "이스트캠프 13기")), a.date.slice(0, 7), esc(a.issuer))).join("")}
    </div></section>

    <section class="sec"><h2>Certificates</h2><div class="list2 mini">
      ${D.certificates.filter((c) => !/운전/.test(c.name)).map((c) => row(esc(c.name), c.date, esc(c.issuer))).join("")}
      ${edu.slice(1, 3).map((e) => row(esc(e.school), e.period_start.slice(0, 7), esc(e.degree))).join("")}
    </div></section>`;
})();
</script>
</body>
</html>
