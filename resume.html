<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>황류이 이력서 · Resume</title>
<meta name="description" content="황류이(Ryu I Hwang) 이력서 — AI · AX Engineer">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --indigo:#4b4a8f;
  --indigo-d:#3b3a78;
  --orange:#f4891f;
  --ink:#2b2d42;
  --muted:#6b6e85;
  --line:#e3e4ee;
  --bg:#e9eaf1;
  --mont:"Montserrat","Pretendard Variable",Pretendard,sans-serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
.toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;background:rgba(233,234,241,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.toolbar a,.toolbar button{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font:600 14px var(--sans);border:0;cursor:pointer}
.toolbar .back{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toolbar .print{background:var(--indigo);color:#fff}
.pages{display:grid;gap:28px;justify-content:center;padding:12px 16px 60px}

/* ---- A4 sheet ---- */
.sheet{position:relative;width:210mm;min-height:297mm;background:#fff;box-shadow:0 20px 50px -20px rgba(40,40,90,.35);display:grid;grid-template-columns:72mm 1fr;overflow:hidden}
.side{position:relative;padding:14mm 9mm 44mm 20mm;text-align:right}
/* indigo curved band along the left edge, like the template */
.side::before{content:"";position:absolute;left:0;top:18mm;width:16mm;height:calc(100% - 18mm);background:var(--indigo);border-radius:0 0 100% 0/0 0 26% 0}
.side::after{content:"";position:absolute;left:0;bottom:0;width:38mm;height:38mm;background:var(--indigo);border-radius:0 100% 0 0;opacity:1}
.side > *{position:relative;z-index:1}
.photo{width:42mm;height:42mm;border-radius:50%;margin:0 0 8mm auto;overflow:hidden;border:2.2mm solid #fff;box-shadow:0 0 0 .6mm var(--line),0 10px 24px -8px rgba(40,40,90,.4);background:#f2f2f6}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.contact{position:relative;padding-right:9mm;margin-bottom:8mm;font-size:9pt;line-height:1.55;color:var(--muted)}
.contact p{margin-bottom:2.6mm}
.contact b{display:block;color:var(--ink);font-weight:600;font-size:8pt;letter-spacing:.06em;font-family:var(--mont)}
.contact .tab{position:absolute;right:-9mm;top:0;bottom:0;width:6.4mm;border-radius:4mm;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center}
.contact .tab span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 7pt var(--mont);letter-spacing:.14em;white-space:nowrap}
.hr{height:.4mm;background:var(--line);margin:0 0 7mm 18mm}
.side h3{display:flex;justify-content:flex-end;align-items:center;gap:2.5mm;font:800 12pt var(--mont);color:var(--orange);letter-spacing:.04em;margin-bottom:5mm}
.side h3 svg{width:4.6mm;height:4.6mm}
.skill{margin-bottom:3mm;font-size:8.6pt;font-weight:600;color:var(--ink)}
.skill .bar{position:relative;height:.9mm;background:#e6e6f0;border-radius:1mm;margin-top:1.6mm;margin-left:14mm}
.skill .bar i{position:absolute;right:0;top:0;bottom:0;background:var(--orange);border-radius:1mm}
.skill .bar i::after{content:"";position:absolute;left:-1.2mm;top:50%;width:2.4mm;height:2.4mm;border-radius:50%;background:var(--orange);transform:translateY(-50%)}
.ref{margin-bottom:3.4mm;font-size:8.4pt;line-height:1.45}
.ref b{display:block;font:700 8.2pt var(--mont);color:var(--ink);letter-spacing:.02em}
.ref span{color:var(--muted);font-size:7.8pt}
.tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:1.6mm;margin-bottom:6mm}
.tags span{font-size:7.6pt;font-weight:600;padding:1mm 2.4mm;border-radius:2mm;background:#f1f1f8;color:var(--indigo-d)}
.side .link{font-size:8.2pt;color:var(--indigo);font-weight:600;display:block;margin-bottom:1.6mm}

.main{padding:15mm 14mm 12mm 6mm;border-left:.4mm solid var(--line);margin:12mm 0;padding-top:3mm;padding-bottom:3mm}
.name{font:800 27pt/1 var(--mont);color:var(--indigo);letter-spacing:.01em}
.name span{font-weight:400;color:var(--ink)}
.name-ko{font:700 12pt var(--sans);color:var(--ink);margin-top:2mm}
.role{font:600 9.6pt var(--mont);letter-spacing:.32em;color:var(--muted);margin:2.6mm 0 7mm;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:2mm;padding:1.6mm 4.4mm;border-radius:999px;background:var(--orange);color:#fff;font:700 9.6pt var(--mont);letter-spacing:.06em;margin-bottom:3mm}
.pill svg{width:4mm;height:4mm}
.about{font-size:8.8pt;line-height:1.7;color:var(--muted);margin-bottom:7mm}
.about b{color:var(--ink)}
.sec{display:flex;align-items:center;gap:2.6mm;font:800 12.6pt var(--mont);color:var(--orange);letter-spacing:.03em;margin:0 0 4mm}
.sec svg{width:5mm;height:5mm;color:var(--indigo)}
.sec::after{content:"";flex:0 0 22mm;height:.5mm;background:var(--ink);margin-left:2mm;opacity:.75}
.tl{position:relative;padding-left:9mm;margin-bottom:7mm}
.tl::before{content:"";position:absolute;left:1.2mm;top:.6mm;bottom:.6mm;width:2.2mm;border-radius:2mm;background:var(--indigo)}
.job{position:relative;margin-bottom:4.2mm}
.job::before{content:"";position:absolute;left:-8.15mm;top:1.3mm;width:1.4mm;height:1.4mm;border-radius:50%;background:#fff}
.job-h{display:flex;justify-content:space-between;gap:3mm;align-items:baseline}
.job h4{font:700 9.4pt var(--sans);color:var(--ink);letter-spacing:-.005em}
.job time{flex:none;font:600 7.8pt var(--mont);color:var(--ink)}
.job .co{font:600 7.8pt var(--sans);color:var(--indigo);margin:.6mm 0 1.2mm}
.job ul{list-style:none}
.job li{position:relative;padding-left:3mm;font-size:8.1pt;line-height:1.55;color:var(--muted)}
.job li::before{content:"";position:absolute;left:0;top:2.1mm;width:1.2mm;height:1.2mm;border-radius:50%;background:var(--orange)}
.job li b{color:var(--ink);font-weight:700}
.foot{position:absolute;right:12mm;bottom:7mm;font:600 7pt var(--mont);color:#a3a5b8;letter-spacing:.1em}
.side .award-l{margin-bottom:3.4mm;font-size:8pt;line-height:1.45}
.side .award-l b{display:block;font-weight:700;color:var(--ink)}
.side .award-l span{color:var(--muted);font-size:7.6pt}

@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .toolbar{display:none}
  .pages{padding:0;gap:0}
  .sheet{box-shadow:none;break-after:page;height:297mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media screen and (max-width:820px){
  .pages{padding:8px 0 40px;justify-content:stretch}
  .sheet{width:100%;min-height:0;grid-template-columns:1fr}
  .side{text-align:left;padding:28px 16px 130px 34px}
  .side::after{width:120px;height:120px}
  .side::before{top:0;width:14px;height:100%}
  .photo{margin:0 0 22px 0;width:150px;height:150px}
  .contact{padding-right:30px}
  .contact .tab{right:0}
  .side h3,.tags{justify-content:flex-start}
  .skill .bar{margin-left:0;margin-right:40px}
  .hr{margin-left:0}
  .main{border-left:0;border-top:1px solid var(--line);margin:0;padding:26px 16px 32px}
  .name{font-size:30px}
  .foot{display:none}
}
</style>
</head>

      ${D.education.slice(1,3).map(e => `<div class="job"><div class="job-h"><h4>${esc(e.school)}</h4><time>${esc(e.period_start.slice(0,7))} — ${esc(e.period_end.slice(0,7))}</time></div><div class="co">${esc(e.degree)}</div></div>`).join("")}
    </div>
    <div class="sec">${I.star} PUBLICATIONS & PATENT</div>
    <div class="tl">${D.publications_patents.map(x => `<div class="job"><div class="job-h"><h4>${esc(x.title_en ? x.title : x.title)}</h4><time>${esc(String(x.date).slice(0,7))}</time></div><div class="co">${esc(x.type)}${x.venue ? " · "+esc(x.venue.split(" –")[0]) : ""}${x.number ? " · "+esc(x.number) : ""}</div></div>`).join("")}</div>`;

  document.getElementById("pages").innerHTML = `
    <article class="sheet"><aside class="side">${side1}</aside><section class="main">${main1}</section><div class="foot">01 / 02</div></article>
    <article class="sheet"><aside class="side">${side2}</aside><section class="main">${main2}</section><div class="foot">02 / 02</div></article>`;
})();
</script>
</body>
